[project]
name = "bwki2025"
version = "0.2.0"
description = "Language identification for rare/low-resource languages"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
    { name = "Tobias Madlberger" },
    { name = "Florian Schwanzer" },
    { name = "Fabian Popov" },
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "dask[complete]>=2025.7.0",
    "distributed>=2025.7.0",
    "duckdb>=1.4.0",
    "fastapi>=0.116.1",
    "fastparquet>=2024.11.0",
    "fasttext>=0.9.2",
    "huggingface-hub>=0.35.0",
    "joblib>=1.3.0",
    "langcodes[data]>=3.5.0",
    "mwparserfromhell>=0.6.4",
    "notebook>=7.4.5",
    "numba>=0.62.0",
    "numpy<2",
    "pandas>=2.0.0",
    "pathlib>=1.0.1",
    "polars>=1.33.1",
    "pyarrow>=21.0.0",
    "pydantic>=2.5.0",
    "pyicu>=2.15.3",
    "python-multipart>=0.0.6",
    "python-simhash>=0.1.0",
    "pywikibot>=8.0.0",
    "pyyaml>=6.0.2",
    "ray>=2.49.2",
    "regex>=2025.9.18",
    "scikit-learn>=1.3.0",
    "seaborn>=0.13.2",
    "tqdm>=4.64.0",
    "uvicorn[standard]>=0.35.0",
    "xxhash>=3.5.0",
]